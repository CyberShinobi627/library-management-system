<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    {% block style %}{% endblock %}
    <style>
        a{
            text-decoration: none;
        }

        /* .nav-left{
            float: left;
        } */
        
        .keeper-nav{
            margin: 50px;
        }

        #nav-right{
            float: right;
        }
    </style>
</head>
<body>
    <div class="nav-left">
        <a href="/keeper/profile">Dashboard</a>
        <a class="keeper-nav" href="{{ url_for('show_books') }}">Show all Books</a>
        <a class="keeper-nav" href="/keeper/add-book">Add Book</a>
        <a class="keeper-nav" href="{{ url_for('update_qty') }}">Update Quantity</a>
        <a class="keeper-nav" href="{{ url_for('pending_orders') }}">Pending Orders</a>
        <a class="keeper-nav" href="{{ url_for('borrowed_books') }}">Borrowed Books</a>
        
        <div id="nav-right">
            <a href="/logout">logout</a>
        </div>
    </div>
    <br><br>
    {% block content %}
    {% endblock %}
</body>
</html>
